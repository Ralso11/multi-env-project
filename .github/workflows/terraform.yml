name: Multi-Environment CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy (dev or prod)'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MULTIENV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MULTIENV_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Plan dev
        run: |
          terraform workspace select -or-create dev
          terraform plan -var-file=dev.tfvars

      - name: Plan prod
        run: |
          terraform workspace select -or-create prod
          terraform plan -var-file=prod.tfvars

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MULTIENV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MULTIENV_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Terraform Init
        run: terraform init

      - name: Select workspace
        run: terraform workspace select -or-create ${{ inputs.environment }}

      - name: Terraform Apply
        run: terraform apply -var-file=${{ inputs.environment }}.tfvars -auto-approve

      - name: Print outputs
        run: terraform output
